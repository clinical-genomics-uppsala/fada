---
pipeline: "pacbio_twist_cancer"
output: "config/output_pacbio_twist_cancer.yaml"
samples: "samples_pacbio_twist_cancer.tsv"
units: "units_pacbio_twist_cancer.tsv"

aligner: "pbmm2"
phaser: "hiphase"
markdups: "pbmarkdup"
trimmer_software: None

reference:
  design_bed: "{{PIPELINE_REF_DATA}}/pb_twist_cancer/expected_capture_targets_covered_CGU_InheritedCancer_v4_LRTE-95759153_combined_sorted_hg38.bed"
  design_genes_bed: "{{PIPELINE_REF_DATA}}/pb_twist_cancer/expected_capture_targets_covered_CGU_InheritedCancer_v4_LRTE-95759153_annotated_sorted_hg38.bed"
  design_pgrs_bed: "{{PIPELINE_REF_DATA}}/pb_twist_cancer/expected_capture_targets_covered_CGU_InheritedCancer_v4_SNP_LRTE-95759153_annotated_sorted_hg38.bed"
  exon_bed: "{{PIPELINE_REF_DATA}}/pb_twist_cancer/Twist_Cancer_230602_hg38_coding_exons.bed"
  pgrs_bed: "{{PIPELINE_REF_DATA}}/pb_twist_cancer/Twist_Cancer_230707_hg38_pgrs_snps.bed"
  skip_contigs: #chromosomes or scaffolds not in the design
    - "^chrX$"
    - "^chrY$"
    - "^chrM$"
    - ".*_random"
    - "chrUn_.*"
    - "chrEBV"
    - "^MAP2K3_.*"
    - "^KCNJ18_.*"
    - "^KMT2C_.*"
  wanted_transcripts: "{{PIPELINE_REF_DATA}}/pb_twist_cancer/wanted_transcripts.bed"

annotate_cnv:
  refseq_genes: "{{PIPELINE_REF_DATA}}/pb_twist_cancer/expected_capture_targets_covered_CGU_InheritedCancer_v4_LRTE-95759153_annotated_sorted_hg38.bed"

bcftools_view_deepvariant:
  PASS: " --apply-filter PASS "
  extra: " "

bcftools_view_snps:
  SNPS: " --apply-filter PASS -v snps "
  extra: " "

bcftools_view_cnvs:
  CNVS: " -e 'INFO/SVTYPE=\"COPY_NORMAL\"'"
  extra: " "

bcftools_view_svs:
  SVS: " --apply-filter PASS "
  extra: " "

cnv_html_report:
  show_table: true
  cytobands: false

cnvkit_batch:
  container: "docker://etal/cnvkit:0.9.11"
  extra: " --segment-method cbs "
  method: "hybrid"
  normal_reference: "{{PIPELINE_REF_DATA}}/pb_twist_cancer/cnvkit.PoN.2.5kb_target.1Mb_antitarget.cnn"

cnvkit_call:
  container: "docker://etal/cnvkit:0.9.11"
  filter: "ci"
  extra: "-t=-1.1,-0.4,0.3,0.7"

cnvkit_vcf:
  hom_del_limit: 0.9330329915368074
  het_del_limit: 1.515716566510398
  dup_limit: 2.4622888266898326

cnvkit_segment:
  container: "docker://etal/cnvkit:0.9.11"
  method: "cbs"

cnvkit_segmetrics:
  container: "docker://etal/cnvkit:0.9.11"
  extra: "--ci "

deepvariant:
  container: "docker://google/deepvariant:1.9.0"
  model_type: "PACBIO"
  output_gvcf: false

export_qc_bedtools_intersect:
  extra: " -wb "

export_qc_bedtools_intersect_pgrs:
  extra: " -wb "

general_report: "config/cnv_pacbio_twist_cancer.yaml"

hiphase:
  container: "docker://hydragenetics/hiphase:1.4.5"
  sv_caller: false
  str_caller: false

pbmarkdup:
  container: "docker://hydragenetics/pbmarkdup:1.1.0"

pbmm2_index:
  preset: "HIFI"
  container: "docker://hydragenetics/pbmm2:1.16"

pbmm2_align:
  preset: "HIFI"
  container: "docker://hydragenetics/pbmm2:1.16"
  extra: "--unmapped "

picard_bed_to_interval_list:
  container: "docker://hydragenetics/picard:2.25.0"
  extra: "SORT=true"

picard_create_sequence_dictionary:
  container: "docker://hydragenetics/picard:2.25.0"

picard_collect_hs_metrics:
  container: "docker://hydragenetics/picard:2.25.0"

merge_cnv_json:
  germline_vcf: "snv_indels/deepvariant/{sample}_{type}.fix_af.bcftools_view.SNPS.vcf.gz"
  filtered_cnv_vcfs: 
    - cnv_sv/cnvkit_vcf/{sample}_{type}.annotate_cnv.refseq_genes.bcftools_view.gene.CNVS.vcf.gz
  unfiltered_cnv_vcfs: 
    - cnv_sv/cnvkit_vcf/{sample}_{type}.annotate_cnv.refseq_genes.vcf.gz
  annotations: 
    - "{{PIPELINE_REF_DATA}}/pb_twist_cancer/expected_capture_targets_covered_CGU_InheritedCancer_v4_LRTE-95759153_combined_sorted_hg38.bed"

minimap2_align:
  container: "docker://hydragenetics/minimap2:2.26"
  preset: "map-hifi"
  extra: "-Y --secondary=no "

mosdepth_bed:
  container: "docker://hydragenetics/mosdepth:0.3.2"
  thresholds: "10,20,50"

multiqc:
  reports:
    pacbio_twist_cancer:
      config: "config/multiqc_config_pacbio_twist_cancer.yaml"
      included_unit_types: ["N"]
      qc_files:
        - "qc/bcftools_stats/{sample}_{type}.stats.txt"
        - "qc/mosdepth_bed_design/{sample}_{type}.mosdepth.summary.txt"
        - "qc/mosdepth_bed_design/{sample}_{type}.mosdepth.region.dist.txt"
        - "qc/mosdepth_bed_design/{sample}_{type}.mosdepth.global.dist.txt"
        - "qc/samtools_stats/{sample}_{type}.samtools-stats.txt"
        - "qc/samtools_idxstats/{sample}_{type}.samtools-idxstats.txt"
        - "qc/picard_collect_hs_metrics/{sample}_{type}.HsMetrics.txt"
        - "prealignment/pbmarkdup/{sample}_{type}_{processing_unit}_{barcode}.bam.log"
        - "qc/sequali/{sample}_{type}_{processing_unit}_{barcode}.json"
        - "qc/nanoplot/{sample}_{type}.txt"
      extra: "-v "

paraphase:
  container: "docker://quay.io/pacbio/paraphase:3.2.1_build1"
  genome: "38"
  extra: "--targeted --min-read-variant 40 --min-read-haplotype 10"
  genes:
    - pms2

samtools_view_on_target:
  container: "docker://hydragenetics/samtools:1.21" 
  extra: "-F 3328" #not prim,not supp, not dup

sawfish_discover:
  extra: "--clobber "
  disable_cnv: true
  maf: true
  container: "docker://hydragenetics/sawfish:2.0.4"
  #expected_cn: ## not specified due to lack of chrX or chrY in the data
  #    male: "{{PIPELINE_REF_DATA}}/expected_cn.hg38.XY.bed" 
  #    female: "{{PIPELINE_REF_DATA}}/expected_cn.hg38.XX.bed"

sawfish_joint_call_single:
  extra: "--clobber "
  container: "docker://hydragenetics/sawfish:2.0.4"
  supporting_reads: true
  
sniffles2_call:
  container: "docker://hydragenetics/sniffles2:2.6.3"
  tandem_repeats: "{{PIPELINE_REF_DATA}}/human_GRCh38_no_alt_analysis_set.trf.bed"

sniffles2_call_mosaic:
  extra: "--mosaic "

svdb_merge:
  tc_method:
    - name: pathology
      cnv_caller:
        - cnvkit

svdb_merge_callers:
  container: "docker://hydragenetics/svdb:2.8.2"
  overlap: 0.6
  priority: "sawfish,cnvkit"
  extra: "--pass_only --no_intra "
  sv_caller:
    - sawfish
    - cnvkit
